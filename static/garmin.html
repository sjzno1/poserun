<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>佳明连接 · 跑步管理系统</title><link rel="stylesheet" href="/vendor/bootstrap-5.3.0/bootstrap.min.css"><link rel="stylesheet" href="/common.css"></head><body><script>window.PAGE='garmin';</script><main class="rm-main"><h1>连接佳明，只读你的训练。</h1><p>端点待真实 key 实测。Personal API 限个人非商业使用；不存佳明账号或密码，不向第三方传递凭证。</p><p><a href="https://connect.garmin.com/app/settings/personalApiToken" rel="noreferrer" target="_blank">在 Garmin Connect 创建 Personal API key</a></p><form id="garminForm" class="rm-panel"><p><label for="garminMode">连接模式</label> <select id="garminMode"><option value="demo">演示（无凭证、不请求佳明）</option><option value="live">真实 key（需服务端显式启用）</option></select></p><p><label for="garminKey">Personal API key</label> <input type="password" id="garminKey" autocomplete="off" spellcheck="false" disabled placeholder="演示模式请勿输入真实 key"></p><p><label for="garminExpiry">有效期（由你声明，未核验）</label> <input type="date" id="garminExpiry" required></p><button>测试并连接</button><p class="rm-evidence">真实 key 仅发送至佳明 token 端点，测试通过后 Fernet 加密保存。主密钥优先 OS keyring；不可用时降级为 600 权限本机主密钥文件，此降级不能抵御整机失陷。</p></form><section class="rm-panel"><h2>连接状态</h2><p id="garminState">等待登录后加载</p><p id="garminSyncState"></p><button id="garminSync" type="button">刷新最近 100 条活动</button><button id="garminDisconnect" type="button">断开连接（保留活动）</button></section><p role="status" id="runningStatus"></p><p class="rm-evidence">演示活动会显式标为 demo，不计入本人周跑量。真实历史回填请使用 FIT 导入；后台自动调度与健康数据同步不在本阶段开放。</p></main><script src="/vendor/bootstrap-5.3.0/bootstrap.bundle.min.js"></script><link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"><script src="/common.js"></script><script src="/icons.js"></script><script src="/running.js"></script></body></html>
